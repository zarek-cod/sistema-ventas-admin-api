<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>ERP Web de Administración</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#eef2f5}h1{color:#2c3e50}.card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);margin-bottom:20px}button{background:#2980b9;color:#fff;border:none;padding:10px 15px;border-radius:4px;cursor:pointer}button:hover{background:#1c5980}input{padding:8px;margin:5px;border:1px solid #ccc;border-radius:4px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background-color:#2980b9;color:#fff}</style></head><body><h1>ERP - Web de Administración</h1><div class="card"><h2>Sincronización del Sistema (API REST)</h2><button onclick="verificarSync()">Verificar Estado de Sincronización</button><div id="sync-status" style="margin-top:10px;font-weight:bold"></div></div><div class="card"><h2>Gestión de Inventario (Agregar Producto)</h2><input type="text" id="nombre-prod" placeholder="Nombre del producto"><input type="number" id="precio-prod" placeholder="Precio"><input type="number" id="stock-prod" placeholder="Stock"><button onclick="crearProducto()">Guardar Producto</button></div><div class="card"><h2>Productos Registrados</h2><button onclick="cargarProductos()">Refrescar Inventario</button><table id="tabla-admin-productos"><thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr></thead><tbody></tbody></table></div><div class="card"><h2>Reporte de Ventas Consolidadas</h2><button onclick="cargarReporteVentas()">Cargar Reporte</button><table id="tabla-admin-ventas"><thead><tr><th>ID Venta</th><th>Fecha</th><th>Total</th></tr></thead><tbody></tbody></table></div><script>const API_URL="http://localhost:3000/api";async function verificarSync(){try{const e=await fetch(`${API_URL}/sync`),t=await e.json();document.getElementById("sync-status").innerText=`Estado: ${t.status.toUpperCase()} | Productos: ${t.productos} | Ventas: ${t.ventas} | Timestamp: ${t.timestamp}`}catch(e){console.error("Error al sincronizar:",e),document.getElementById("sync-status").innerText="Error al conectar con la API REST"}}async function crearProducto(){const e=document.getElementById("nombre-prod").value,t=parseFloat(document.getElementById("precio-prod").value),n=parseInt(document.getElementById("stock-prod").value);if(!e||isNaN(t)||isNaN(n))return alert("Por favor complete todos los campos");try{const a=await fetch(`${API_URL}/productos`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:e,precio:t,stock:n})}),o=await a.json();alert("Producto creado: "+o.nombre),cargarProductos()}catch(e){console.error("Error al crear producto:",e)}}async function cargarProductos(){try{const e=await fetch(`${API_URL}/productos`),t=await e.json(),n=document.querySelector("#tabla-admin-productos tbody");n.innerHTML="",t.forEach(e=>{n.innerHTML+=`<tr><td>${e.id}</td><td>${e.nombre}</td><td>$${e.precio}</td><td>${e.stock}</td></tr>`})}catch(e){console.error("Error al cargar productos:",e)}}async function cargarReporteVentas(){try{const e=await fetch(`${API_URL}/ventas`),t=await e.json(),n=document.querySelector("#tabla-admin-ventas tbody");n.innerHTML="",t.forEach(e=>{n.innerHTML+=`<tr><td>#${e.id}</td><td>${new Date(e.fecha).toLocaleString()}</td><td>$${e.total}</td></tr>`})}catch(e){console.error("Error al cargar reporte de ventas:",e)}}</script></body></html>
