<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>POS Web de Ventas</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f9}h1{color:#2c3e50}.card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1);margin-bottom:20px}button{background:#27ae60;color:#fff;border:none;padding:10px 15px;border-radius:4px;cursor:pointer}button:hover{background:#219150}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ddd;padding:8px;text-align:left}th{background-color:#27ae60;color:#fff}</style></head><body><h1>POS - Web de Ventas</h1><div class="card"><h2>Catálogo de Productos (API REST)</h2><button onclick="cargarProductos()">Cargar Productos</button><table id="tabla-productos"><thead><tr><th>ID</th><th>Producto</th><th>Precio</th><th>Stock</th><th>Acción</th></tr></thead><tbody></tbody></table></div><div class="card"><h2>Carrito / Registrar Venta</h2><div id="carrito-info">No hay productos en el carrito</div><br><button onclick="registrarVenta()">Procesar Venta</button></div><div class="card"><h2>Historial de Ventas</h2><button onclick="cargarVentas()">Actualizar Ventas</button><ul id="lista-ventas"></ul></div><script>const API_URL="http://localhost:3000/api";async function cargarProductos(){try{const e=await fetch(`${API_URL}/productos`),t=await e.json(),a=document.querySelector("#tabla-productos tbody");a.innerHTML="",t.forEach(e=>{a.innerHTML+=`<tr><td>${e.id}</td><td>${e.nombre}</td><td>$${e.precio}</td><td>${e.stock}</td><td><button onclick="agregarAlCarrito(${e.id},'${e.nombre}',${e.precio})">Agregar</button></td></tr>`})}catch(e){console.error("Error al cargar productos:",e)}}let carrito=[];function agregarAlCarrito(e,t,a){carrito.push({id:e,nombre:t,precio:a}),document.getElementById("carrito-info").innerText=`Items en carrito: ${carrito.length} - Total: $${carrito.reduce((e,t)=>e+t.precio,0)}`}async function registrarVenta(){if(0===carrito.length)return alert("El carrito está vacío");try{const e=await fetch(`${API_URL}/ventas`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:carrito,total:carrito.reduce((e,t)=>e+t.precio,0)})}),t=await e.json();alert("Venta realizada con éxito! ID: "+t.id),carrito=[],document.getElementById("carrito-info").innerText="No hay productos en el carrito",cargarVentas()}catch(e){console.error("Error al registrar venta:",e)}}async function cargarVentas(){try{const e=await fetch(`${API_URL}/ventas`),t=await e.json(),a=document.getElementById("lista-ventas");a.innerHTML="",t.forEach(e=>{a.innerHTML+=`<li>Venta #${e.id} - Total: $${e.total} (${new Date(e.fecha).toLocaleString()})</li>`})}catch(e){console.error("Error al cargar ventas:",e)}}</script></body></html>
